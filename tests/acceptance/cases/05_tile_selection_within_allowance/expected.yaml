id: 5
title: Tile selection within allowance
mode: advice
capability: Correct document selection
difficulty: Look-alike / Document selection
failure_looks_like: Generates an unnecessary PCO without evaluating the allowance process

exact:
  document: no PCO for the selection itself
  citations:
    - {id: FCM-09, section: "8.1", for: documented owner selection}
    - {id: FCM-09, section: "8.2", for: confirmation by email or signed selection sheet}
    - {id: CHG-51, section: "10.1", for: change event for the allowance variance}
    - {id: CON-17, section: "10.3", for: reconcile as a credit per the contract}
  must_state:
    - No PCO for the selection itself
    - Confirm the selection by email or signed selection sheet
    - Open a change event for the $1,600 allowance variance
    - Reconcile it as a credit on a pay application or a credit change order, per the contract
  allowance:
    amount: "15000"
    selected: "13400"
    under: "1600"

judged:
  - How it explains this to the PM

resolved:   # Not graded. Former review notes, settled by Justin.
  - FCM-09 8.1 and 8.2 are both cited. "Email or signed selection sheet" is in 8.2.
  - CHG-51 10.1 applies. The variance gets a change event, though the selection itself gets no PCO.
  - CON-17 10.3 applies. The credit goes on a pay application or a credit change order, per the contract.
